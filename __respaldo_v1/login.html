<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoMotors - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <div class="header-contenido">
      <a href="index.html" class="logo">
        <h2>AutoMotors</h2>
      </a>
      
      <nav>
        <a href="index.html">Inicio</a>
        <a href="blogs.html">Blogs</a>
        <a href="contacto.html">Contacto</a>
        <a href="registro.html">Registrarse</a>
      </nav>

      <div class="acciones-header">
        <a href="login.html" class="btn-header-login">Iniciar Sesión</a>
        <a href="carrito.html" class="btn-header-cart">Carrito (<span id="cant-carrito">0</span>)</a>
      </div>
    </div>
  </header>

  <main class="contenedor">
    <div class="caja-formulario">
      <h2>Iniciar Sesión</h2>
      <p>Ingresa tus credenciales para acceder a la plataforma.</p>

      <form id="form-login">
        <div class="campo">
          <label for="login-email">Correo Electrónico</label>
          <input type="email" id="login-email" placeholder="ejemplo@duoc.cl" required>
        </div>

        <div class="campo">
          <label for="login-pass">Contraseña</label>
          <input type="password" id="login-pass" required>
        </div>

        <button type="submit" class="btn-primario">Ingresar</button>
      </form>
    </div>
  </main>

  <footer>

  </footer>

  <script src="js/datos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/validador.js"></script>
</body>
</html>
