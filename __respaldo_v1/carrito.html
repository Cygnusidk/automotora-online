<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoMotors - Carrito</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <div class="header-contenido">
      <a href="index.html" class="logo">
        <h2>AutoMotors</h2>
      </a>
      
      <nav>
        <a href="index.html">Inicio</a>
        <a href="blogs.html">Blogs</a>
        <a href="contacto.html">Contacto</a>
        <a href="registro.html">Registrarse</a>
      </nav>

      <div class="acciones-header">
        <a href="login.html" class="btn-header-login">Iniciar Sesión</a>
        <a href="carrito.html" class="btn-header-cart">Carrito (<span id="cant-carrito">0</span>)</a>
      </div>
    </div>
  </header>

  <main class="contenedor">
    <h2 class="titulo-seccion">Carrito de Compras</h2>

    <div class="caja-tabla">
      <table class="tabla-personalizada">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="items-carrito">
        </tbody>
      </table>

      <div class="resumen-tabla">
        <h3>Total: <span id="total-carrito">$0</span></h3>
        <button type="button" class="btn-primario btn-pagar" style="width: auto; padding: 8px 20px;">Pagar</button>
      </div>
    </div>
  </main>

  <footer>

  </footer>

  <script src="js/datos.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
